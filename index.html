<!doctype html>
<html lang="ku" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZnarTV</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="brand">ZnarTV</div><div class="sub">Live TV</div></header>
<main>
<section class="toolbar"><input id="search" placeholder="گەڕان بە ناوی کەنال..."/><select id="category"><option value="all">هەموو کەنالەکان</option></select></section>
<section id="categories" class="chips"></section>
<div id="grid" class="grid"></div>
</main>
<div id="player" class="modal hidden"><div class="playerbox"><button id="close">×</button><h2 id="ptitle"></h2><video id="video" controls autoplay playsinline></video><p id="pmsg"></p></div></div>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>
const grid = document.getElementById('grid');
const search = document.getElementById('search');
const category = document.getElementById('category');
const chips = document.getElementById('categories');
const player = document.getElementById('player');
const video = document.getElementById('video');
const ptitle = document.getElementById('ptitle');
const pmsg = document.getElementById('pmsg');
const closeBtn = document.getElementById('close');
let channels = [], hls = null;

const html = {escape:s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))};
function parseM3U(txt){
  const lines = txt.split(/?
/).map(x=>x.trim()).filter(Boolean);
  const out=[];
  for(let i=0;i<lines.length;i++){
    if(lines[i].startsWith('#EXTINF:')){
      const info=lines[i];
      const comma=info.indexOf(',');
      const name=comma>=0 ? info.slice(comma+1).trim() : 'Channel';
      const group=(info.match(/group-title="([^"]*)"/i)||[])[1] || 'Kurdish';
      const logo=(info.match(/tvg-logo="([^"]*)"/i)||[])[1] || '';
      const url=lines[i+1] && !lines[i+1].startsWith('#') ? lines[i+1] : '';
      if(url) out.push({name,group,logo,url});
    }
  }
  return out;
}

function render(list=channels){
  grid.innerHTML='';
  if(!list.length){ grid.innerHTML='<p>هیچ کەنالێک نەدۆزرایەوە.</p>'; return; }
  list.forEach(c=>{
    const card=document.createElement('article');
    card.className='channel';
    card.innerHTML=`
      <div class="logo">${c.logo ? `<img src="${html.escape(c.logo)}" alt="">` : 'TV'}</div>
      <h3>${html.escape(c.name)}</h3>
      <small>${html.escape(c.group)}</small>
      <button>▶️ Play</button>`;
    card.querySelector('button').onclick=()=>play(c);
    grid.appendChild(card);
  });
}
function fillCategories(){
  const groups=[...new Set(channels.map(c=>c.group).filter(Boolean))];
  category.innerHTML='<option value="all">هەموو کەنالەکان</option>'+groups.map(g=>`<option value="${html.escape(g)}">${html.escape(g)}</option>`).join('');
  chips.innerHTML=groups.map(g=>`<button data-g="${html.escape(g)}">${html.escape(g)}</button>`).join('');
  chips.querySelectorAll('button').forEach(b=>b.onclick=()=>{category.value=b.dataset.g; filter();});
}
function filter(){
  const q=search.value.toLowerCase().trim(), g=category.value;
  render(channels.filter(c=>(g==='all'||c.group===g) && c.name.toLowerCase().includes(q)));
}
function play(c){
  player.classList.remove('hidden'); ptitle.textContent=c.name; pmsg.textContent='';
  if(hls){hls.destroy();hls=null;}
  video.pause(); video.removeAttribute('src'); video.load();
  if(video.canPlayType('application/vnd.apple.mpegurl')){
    video.src=c.url; video.play().catch(()=>{});
  }else if(window.Hls && Hls.isSupported()){
    hls=new Hls(); hls.loadSource(c.url); hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(()=>{}));
    hls.on(Hls.Events.ERROR,()=>pmsg.textContent='ئەم Stream ـە لە ئێستادا کار ناکات یان ڕێگەی CORS داخراوە.');
  }else pmsg.textContent='ئەم براوزەرە HLS پشتگیری ناکات.';
}
function closePlayer(){if(hls){hls.destroy();hls=null;} video.pause(); video.removeAttribute('src'); video.load(); player.classList.add('hidden');}
closeBtn.onclick=closePlayer;
search.oninput=filter; category.onchange=filter;
window.addEventListener('click',e=>{if(e.target===player)closePlayer();});

fetch('Kurdish_Channels.m3u')
  .then(r=>{if(!r.ok) throw new Error('M3U not found'); return r.text();})
  .then(txt=>{channels=parseM3U(txt); fillCategories(); render();})
  .catch(()=>{grid.innerHTML='<p>فایلی Kurdish_Channels.m3u نەدۆزرایەوە. هەردوو فایلەکە (index.html و Kurdish_Channels.m3u) لە هەمان فولدەر دابنێ.</p>';});
</script>

</body></html>
